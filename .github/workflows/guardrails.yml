name: quant-guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [release]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "18.20.8"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify guardrails
        env:
          PYTHON_BIN: python
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          # 只有经维护者显式标记的 PR 才能通过 M0 人工审批门禁。
          QUANT_APPROVE_M0_CHANGE: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'm0-approved') && '1' || '0' }}
        run: ./scripts/verify.sh
